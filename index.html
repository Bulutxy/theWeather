<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hava Durumu Uygulaması</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🌤 Hava Durumu</h1>

<div class="searchBox">

<input type="text" id="cityInput" placeholder="Şehir giriniz">

<button id="searchBtn">Ara</button>

</div>

<div class="weatherCard">

<h2 id="city">Şehir</h2>

<img id="icon" src="" alt="">

<h1 id="temp">--°C</h1>

<p id="desc">Açıklama</p>

<div class="details">

<div class="box">
<span>Nem</span>
<p id="humidity">--%</p>
</div>

<div class="box">
<span>Rüzgar</span>
<p id="wind">-- km/s</p>
</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
